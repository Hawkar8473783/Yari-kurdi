<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#170d09">
<title>جەنگی کارت | یاری کوردی</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#3a2115,#170d09 55%,#0b0705);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:900px;margin:auto;padding:12px;min-height:100vh}.top{display:flex;align-items:center;gap:9px;margin-bottom:12px}.icon{width:44px;height:44px;border:1px solid #795126;border-radius:14px;background:#25150e;color:#ffd477;font-size:25px}.title{flex:1;text-align:center}.title h1{margin:0;color:#ffe1a0;font-size:22px}.title p{margin:3px 0 0;color:#a99480;font-size:12px}.coin{background:#25150e;border:1px solid #795126;border-radius:14px;padding:10px 12px;color:#ffd35b;font-weight:bold}.turn{width:max-content;margin:0 auto 12px;padding:9px 18px;border:1px solid #956328;border-radius:25px;background:#24150f;color:#ffd477}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{border:1px solid #50331f;border-radius:17px;background:#21130e;text-align:center;padding:11px}.score.active{border-color:#d19237;box-shadow:0 0 20px #b977241f}.score small{color:#9f8c7a}.score b{display:block;font-size:27px;color:#ffe09a;margin:3px 0}.arena{margin-top:14px;border:2px solid #795126;border-radius:27px;background:radial-gradient(circle,#25573b,#123523 75%);padding:18px;min-height:390px;box-shadow:inset 0 0 50px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.label{color:#d2c0ad;font-size:13px}.cards{display:flex;align-items:center;justify-content:center;gap:28px;min-height:180px}.card{width:112px;height:158px;border-radius:16px;background:linear-gradient(145deg,#fffdf4,#d9d0bb);border:3px solid #b58a42;box-shadow:0 8px 20px #0008;position:relative;color:#17120f;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold}.card.red{color:#b62920}.card.back{background:repeating-linear-gradient(135deg,#8a581f 0 7px,#bb7b28 7px 12px);color:transparent}.card.back:after{content:'🃏';font-size:42px;filter:grayscale(1) brightness(1.5);opacity:.75}.vs{color:#ffd477;font-weight:bold;font-size:18px}.result{min-height:28px;text-align:center;color:#ffe0a0;font-weight:bold}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.btn{min-height:52px;border:1px solid #70491f;border-radius:14px;background:#29170f;color:#ead5b6;font-weight:bold;font-size:15px}.btn.primary{grid-column:1/-1;background:linear-gradient(135deg,#c78321,#8c5115);color:white;border-color:#e0a13e}.btn:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#1c100c;border:1px solid #452b1a;border-radius:13px;padding:9px;text-align:center}.stat small{color:#877565}.stat b{display:block;color:#e9c57a;font-size:17px;margin-top:3px}.hint{text-align:center;color:#a99582;font-size:12px;margin-top:10px;line-height:1.7}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,80px);opacity:0;background:#29170f;border:1px solid #8b5b26;color:#ffe0a0;padding:11px 17px;border-radius:14px;transition:.25s;z-index:20;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.box{width:100%;max-width:380px;text-align:center;background:linear-gradient(145deg,#302016,#180e0a);border:1px solid #9a682d;border-radius:24px;padding:28px}.emoji{font-size:52px}.box h2{color:#ffe0a0}.box p{color:#c2ad98;line-height:1.8}.reward{color:#ffd25d;font-weight:bold;margin:14px}@media(max-width:500px){.app{padding:10px}.arena{min-height:350px;padding:12px}.card{width:92px;height:136px;font-size:40px}.cards{gap:16px}.scores{gap:7px}.coin{padding:9px 10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="icon" onclick="home()">‹</button><div class="title"><h1>🃏 جەنگی کارت</h1><p>یاری کوردی</p></div><div class="coin">🪙 <span id="coins">0</span></div></header>
<div id="turn" class="turn">نۆرەی تۆیە 🎯</div>
<section class="scores"><div id="pcard" class="score active"><small>👤 تۆ</small><b id="pscore">0</b><small>بردن</small></div><div id="acard" class="score"><small>🤖 AI</small><b id="ascore">0</b><small>بردن</small></div></section>
<section class="arena">
<div class="label">کارتەکانی AI</div>
<div id="aiCard" class="card back">🃏</div>
<div class="cards"><div id="playerCard" class="card">?</div><div class="vs">VS</div><div id="cpuCard" class="card">?</div></div>
<div class="result" id="result">کرتە لە «کارتێک بخە» بۆ دەستپێکردن</div>
<div class="label">کارتەکانی تۆ: <b id="remaining">26</b></div>
</section>
<div class="controls"><button id="playBtn" class="btn primary" onclick="playCard()">🃏 کارتێک بخە</button><button class="btn" onclick="newGame()">🔄 یاریی نوێ</button><button class="btn" onclick="home()">🏠 سەرەکی</button></div>
<div class="stats"><div class="stat"><small>بردن</small><b id="wins">0</b></div><div class="stat"><small>باختن</small><b id="losses">0</b></div><div class="stat"><small>یەکسان</small><b id="draws">0</b></div></div>
<div class="hint">52 کارت · 26 کارت بۆ هەر یاریزانێک · هەر جارە کارتێک بخە و کارتێکی AI دەردەکەوێت.</div>
</div>
<div id="modal" class="modal"><div class="box"><div id="emoji" class="emoji">🏆</div><h2 id="title">پیرۆزە!</h2><p id="text"></p><div id="reward" class="reward"></div><button class="btn primary" onclick="newGame()">🔄 یارییەکی تر</button><button class="btn" style="width:100%;margin-top:8px" onclick="home()">🏠 سەرەکی</button></div></div>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);
const suits=[{s:'♥',r:'red'},{s:'♦',r:'red'},{s:'♣',r:''},{s:'♠',r:''}];
const ranks=[{n:'2',v:2},{n:'3',v:3},{n:'4',v:4},{n:'5',v:5},{n:'6',v:6},{n:'7',v:7},{n:'8',v:8},{n:'9',v:9},{n:'10',v:10},{n:'J',v:11},{n:'Q',v:12},{n:'K',v:13},{n:'A',v:14}];
let deck=[],player=[],ai=[],turn=true,over=false,roundBusy=false;
let coins=+localStorage.getItem('yk_coins')||0;
let wins=+localStorage.getItem('yk_cards_wins')||0,losses=+localStorage.getItem('yk_cards_losses')||0,draws=+localStorage.getItem('yk_cards_draws')||0;
function makeDeck(){let d=[];suits.forEach(s=>ranks.forEach(r=>d.push({suit:s.s,red:s.r,name:r.n,value:r.v,id:s.s+r.n})));return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){deck=shuffle(makeDeck());player=deck.splice(0,26);ai=deck.splice(0,26);turn=true;over=false;roundBusy=false;$('modal').classList.remove('show');$('playerCard').textContent='?';$('cpuCard').textContent='?';$('playerCard').className='card';$('cpuCard').className='card';$('aiCard').style.visibility='visible';$('result').textContent='کرتە لە «کارتێک بخە» بۆ دەستپێکردن';render()}
function playCard(){if(over||!turn||roundBusy)return;if(!player.length||!ai.length){finish(player.length?'ai':'player');return}roundBusy=true;turn=false;$('turn').textContent='AI کارت هەڵدەبژێرێت... 🤖';let p=player.pop(),a=ai.pop();showCard($('playerCard'),p);showCard($('cpuCard'),a);$('remaining').textContent=player.length;setTimeout(()=>resolveRound(p,a),500)}
function showCard(el,c){el.textContent=c.name+c.suit;el.className='card'+(c.red?' red':'')}
function resolveRound(p,a){let msg='';if(p.value>a.value){wins++;coins+=5;msg='تۆ ئەم دەورەت بردتەوە! 🏆'}else if(a.value>p.value){losses++;msg='AI ئەم دەورەتە بردی 🤖'}else{draws++;coins+=1;msg='دەورەکە یەکسان بوو 🤝'}save();$('result').textContent=msg;turn=true;roundBusy=false;if(!player.length||!ai.length){let winner=player.length?'player':ai.length?'ai':'draw';setTimeout(()=>finish(winner),650)}else{$('turn').textContent='نۆرەی تۆیە 🎯'}render()}
function finish(w){if(over)return;over=true;roundBusy=false;if(w==='player'){$('emoji').textContent='🏆';$('title').textContent='پیرۆزە! تۆ بردتەوە 🎉';$('text').textContent='کارتەکانی تۆ زووتر تەواو بوون.';$('reward').textContent='🪙 +50 Coin';coins+=50;save()}else if(w==='ai'){$('emoji').textContent='🤖';$('title').textContent='AI بردی';$('text').textContent='AI زووتر کارتەکانی تەواو کرد.';$('reward').textContent='🪙 +0 Coin'}else{$('emoji').textContent='🤝';$('title').textContent='یەکسان بوو';$('text').textContent='هەردوو لایەن کارتەکانیان تەواو کرد.';$('reward').textContent='🪙 +10 Coin';coins+=10;save()}$('turn').textContent='یاری کۆتایی هات 🏁';render();setTimeout(()=>$('modal').classList.add('show'),350)}
function save(){localStorage.setItem('yk_coins',coins);localStorage.setItem('yk_cards_wins',wins);localStorage.setItem('yk_cards_losses',losses);localStorage.setItem('yk_cards_draws',draws)}
function render(){$('coins').textContent=coins;$('wins').textContent=wins;$('losses').textContent=losses;$('draws').textContent=draws;$('remaining').textContent=player.length;$('pscore').textContent=wins;$('ascore').textContent=losses;$('playBtn').disabled=over||!turn||roundBusy||!player.length||!ai.length;$('pcard').classList.toggle('active',turn&&!over);$('acard').classList.toggle('active',!turn&&!over)}
let tt;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),1600)}
function home(){location.href='../'}
newGame();
</script>
</body>
</html>
