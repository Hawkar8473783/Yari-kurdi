<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#170d09">
<title>دۆمینۆ Pro | یاری کوردی</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#3a2115,#170d09 55%,#0b0705);color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:12px;min-height:100vh}.top{display:flex;align-items:center;gap:9px;margin-bottom:10px}.iconbtn{width:44px;height:44px;border:1px solid #795126;border-radius:14px;background:#25150e;color:#ffd477;font-size:24px}.title{flex:1;text-align:center}.title h1{margin:0;color:#ffe1a0;font-size:22px}.title p{margin:3px 0 0;color:#a99480;font-size:12px}.coin{background:#25150e;border:1px solid #795126;border-radius:14px;padding:10px 12px;color:#ffd35b;font-weight:bold}.turn{width:max-content;margin:0 auto 12px;padding:9px 18px;border:1px solid #956328;border-radius:25px;background:#24150f;color:#ffd477}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{border:1px solid #50331f;border-radius:17px;background:#21130e;text-align:center;padding:11px}.score.active{border-color:#d19237;box-shadow:0 0 20px #b977241f}.score small{color:#9f8c7a}.score b{display:block;font-size:27px;color:#ffe09a;margin:3px 0}.aihand{display:flex;justify-content:center;gap:7px;min-height:54px;padding:12px 0}.backtile{width:34px;height:48px;border:2px solid #9b6727;border-radius:8px;background:repeating-linear-gradient(135deg,#8a581f 0 4px,#bb7b28 4px 7px);box-shadow:0 3px 8px #0006}.table{margin-top:2px;min-height:300px;border:2px solid #795126;border-radius:27px;background:radial-gradient(circle,#25573b,#123523 75%);padding:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 50px #0005}.board{width:100%;display:flex;flex-wrap:nowrap;gap:7px;align-items:center;overflow-x:auto;padding:15px 5px;direction:ltr;scrollbar-width:thin}.board::-webkit-scrollbar{height:5px}.board::-webkit-scrollbar-thumb{background:#b47a2a;border-radius:20px}.empty{color:#b9ad9e;text-align:center;line-height:2;max-width:340px}.tile{width:48px;height:76px;flex:0 0 auto;border:2px solid #b58a42;border-radius:9px;background:linear-gradient(145deg,#fffdf4,#d9d0bb);color:#17120f;box-shadow:0 5px 12px #0007;display:flex;flex-direction:column;overflow:hidden;animation:in .2s ease}.tile.clickable{cursor:pointer}.tile.clickable:hover,.tile.clickable:active{transform:translateY(-6px);border-color:#ffd15c}.tile.disabled{opacity:.45}.half{height:50%;display:flex;align-items:center;justify-content:center}.half:first-child{border-bottom:1px solid #817865}.dots{width:28px;height:28px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.dot{width:6px;height:6px;background:#211a15;border-radius:50%;align-self:center;justify-self:center}.handtitle{text-align:center;color:#c9b7a4;font-size:13px;margin:13px 0 7px}.hand{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:86px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.btn{min-height:50px;border:1px solid #70491f;border-radius:14px;background:#29170f;color:#ead5b6;font-weight:bold;font-size:15px}.btn.primary{grid-column:1/-1;background:linear-gradient(135deg,#c78321,#8c5115);color:white;border-color:#e0a13e}.btn:disabled{opacity:.4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#1c100c;border:1px solid #452b1a;border-radius:13px;padding:9px;text-align:center}.stat small{color:#877565}.stat b{display:block;color:#e9c57a;font-size:17px;margin-top:3px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{width:100%;max-width:380px;text-align:center;background:linear-gradient(145deg,#302016,#180e0a);border:1px solid #9a682d;border-radius:24px;padding:28px}.box .emoji{font-size:52px}.box h2{color:#ffe0a0}.box p{color:#c2ad98;line-height:1.8}.reward{color:#ffd25d;font-weight:bold;margin:14px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,80px);opacity:0;background:#29170f;border:1px solid #8b5b26;color:#ffe0a0;padding:11px 17px;border-radius:14px;transition:.25s;z-index:20;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}@keyframes in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}@media(max-width:500px){.app{padding:10px}.table{min-height:280px;padding:12px 5px}.tile{width:44px;height:70px}.hand{gap:5px}.aihand{gap:5px}.backtile{width:31px;height:45px}.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="iconbtn" onclick="home()">‹</button><div class="title"><h1>🀄 دۆمینۆ Pro</h1><p>یاری کوردی</p></div><div class="coin">🪙 <span id="coins">0</span></div></header>
<div id="turn" class="turn">نۆرەی تۆیە 🎯</div>
<section class="scores"><div id="pcard" class="score active"><small>👤 تۆ</small><b id="pscore">0</b><small>خاڵی پارچەکان</small></div><div id="acard" class="score"><small>🤖 AI</small><b id="ascore">0</b><small>خاڵی پارچەکان</small></div></section>
<div id="aihand" class="aihand"></div>
<section class="table"><div id="empty" class="empty">یەکەم پارچەکەت هەڵبژێرە<br>دواتر یاری دەستی پێدەکات 🀄</div><div id="board" class="board"></div></section>
<div class="handtitle">پارچەکانی تۆ — <span id="count">7</span></div>
<div id="hand" class="hand"></div>
<div id="hint" class="empty" style="min-height:30px;font-size:12px;max-width:none">پارچەیەک هەڵبژێرە بۆ یاری‌کردن</div>
<div class="controls"><button id="draw" class="btn primary" onclick="draw()">🎴 کێشان</button><button class="btn" onclick="newGame()">🔄 یاریی نوێ</button><button class="btn" onclick="home()">🏠 سەرەکی</button></div>
<div class="stats"><div class="stat"><small>پارچەی ماوە</small><b id="left">14</b></div><div class="stat"><small>بردن</small><b id="wins">0</b></div><div class="stat"><small>باختن</small><b id="losses">0</b></div></div>
</div>
<div id="modal" class="modal"><div class="box"><div id="resultEmoji" class="emoji">🏆</div><h2 id="resultTitle">پیرۆزە!</h2><p id="resultText"></p><div id="reward" class="reward"></div><button class="btn primary" onclick="newGame()">🔄 یارییەکی تر</button><button class="btn" style="width:100%;margin-top:8px" onclick="home()">🏠 سەرەکی</button></div></div>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);
let deck=[],hand=[],ai=[],stock=[],board=[],turn='player',over=false;
let coins=+localStorage.getItem('yk_coins')||0,wins=+localStorage.getItem('yk_domino_wins')||0,losses=+localStorage.getItem('yk_domino_losses')||0;
const all=()=>{let a=[];for(let x=0;x<=6;x++)for(let y=x;y<=6;y++)a.push({a:x,b:y,id:x+'-'+y});return a};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){ $('modal').classList.remove('show');deck=shuffle(all());hand=deck.splice(0,7);ai=deck.splice(0,7);stock=deck;board=[];turn='player';over=false;render();toast('یارییەکە دەستی پێکرد 🎮') }
function playable(t){if(!board.length)return true;let l=board[0].a,r=board[board.length-1].b;return t.a===l||t.b===l||t.a===r||t.b===r}
function place(t){if(!board.length){board.push({a:t.a,b:t.b});return true}let l=board[0].a,r=board[board.length-1].b;if(t.a===r){board.push({a:t.a,b:t.b});return true}if(t.b===r){board.push({a:t.b,b:t.a});return true}if(t.b===l){board.unshift({a:t.a,b:t.b});return true}if(t.a===l){board.unshift({a:t.b,b:t.a});return true}return false}
function play(i){if(over||turn!=='player')return;let t=hand[i];if(!playable(t)){toast('ئەم پارچەیە ناتوانرێت دابنرێت ❌');return}place(t);hand.splice(i,1);render();if(!hand.length){finish('player');return}turn='ai';render();setTimeout(aiMove,650)}
function draw(){if(over||turn!=='player')return;if(hand.some(playable)&&board.length){toast('پارچەی قابل‌یاری هەیە 🎯');return}if(!stock.length){toast('پارچەی ماوە نییە');return}hand.push(stock.shift());render();toast(playable(hand[hand.length-1])?'پارچەکەت قابل‌یارییە ✅':'پارچەیەکی تر کێشە 🎴')}
function aiMove(){if(over)return;turn='ai';render();let p=ai.filter(playable);while(!p.length&&stock.length){ai.push(stock.shift());p=ai.filter(playable)}if(!p.length){turn='player';render();checkBlocked();return}p.sort((x,y)=>(y.a+y.b)-(x.a+x.b));let t=p[0],i=ai.findIndex(x=>x.id===t.id);place(ai[i]);ai.splice(i,1);render();if(!ai.length){finish('ai');return}turn='player';render()}
function checkBlocked(){if(stock.length)return;let a=pips(hand),b=pips(ai);if(a<b)finish('player');else if(b<a)finish('ai');else finish('draw')}
function pips(a){return a.reduce((s,t)=>s+t.a+t.b,0)}
function finish(w){if(over)return;over=true;if(w==='player'){wins++;coins+=50;save();$('resultEmoji').textContent='🏆';$('resultTitle').textContent='پیرۆزە! تۆ بردتەوە 🎉';$('resultText').textContent='تۆ هەموو پارچەکانت تەواو کرد.';$('reward').textContent='🪙 +50 Coin'}else if(w==='ai'){losses++;save();$('resultEmoji').textContent='🤖';$('resultTitle').textContent='AI بردی';$('resultText').textContent='ئەمجارە AI پێش تۆ هەموو پارچەکانی تەواو کرد.';$('reward').textContent='🪙 +0 Coin'}else{coins+=10;save();$('resultEmoji').textContent='🤝';$('resultTitle').textContent='یەکسان بوو';$('resultText').textContent='خاڵەکان یەکسان بوون.';$('reward').textContent='🪙 +10 Coin'}render();setTimeout(()=>$('modal').classList.add('show'),250)}
function save(){localStorage.setItem('yk_coins',coins);localStorage.setItem('yk_domino_wins',wins);localStorage.setItem('yk_domino_losses',losses)}
const positions={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function tile(t,click,disabled){let e=document.createElement('div');e.className='tile'+(click?' clickable':'')+(disabled?' disabled':'');e.innerHTML=half(t.a)+half(t.b);if(click)e.onclick=()=>play(click);return e}
function half(n){let s='<div class="half"><div class="dots">';for(let i=0;i<9;i++)s+=positions[n].includes(i)?'<i class="dot"></i>':'<i></i>';return s+'</div></div>'}
function render(){
 $('coins').textContent=coins;$('wins').textContent=wins;$('losses').textContent=losses;$('left').textContent=stock.length;$('count').textContent=hand.length;$('pscore').textContent=pips(hand);$('ascore').textContent=pips(ai);
 $('turn').textContent=over?'یاری کۆتایی هات 🏁':turn==='player'?'نۆرەی تۆیە 🎯':'نۆرەی AI ـە 🤖';$('pcard').classList.toggle('active',turn==='player');$('acard').classList.toggle('active',turn==='ai');
 let ah=$('aihand');ah.innerHTML='';ai.forEach(()=>{let d=document.createElement('div');d.className='backtile';ah.appendChild(d)});
 let b=$('board');b.innerHTML='';$('empty').style.display=board.length?'none':'block';board.forEach(t=>b.appendChild(tile(t)));setTimeout(()=>b.scrollLeft=b.scrollWidth,30);
 let h=$('hand');h.innerHTML='';hand.forEach((t,i)=>h.appendChild(tile(t,i+1,!playable(t))));$('draw').disabled=over||turn!=='player'||(board.length>0&&hand.some(playable))||!stock.length;$('hint').textContent=turn==='player'?(hand.some(playable)?'پارچەی گونجاو هەڵبژێرە 🎯':'هیچ پارچەیەکی گونجاو نییە؛ کێشان بکە 🎴'):'چاوەڕێی AI بکە 🤖';
}
let tt;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function home(){location.href='../'}
newGame();
</script>
</body></html>
