<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<title>دۆمینۆ | یاری کوردی</title>
<style>
:root{--bg:#120b08;--panel:#24150e;--panel2:#2d1b12;--gold:#e3a33c;--gold2:#ffd77a;--muted:#aa9684;--green:#173b29;--green2:#0f2a1d;--line:#694622;--danger:#e8897d;--white:#fff9ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#422719 0,#21130d 35%,#100906 75%);overflow-x:hidden}button{font:inherit}
.app{width:min(960px,100%);margin:auto;min-height:100vh;padding:12px 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.top{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:9px}.iconbtn,.coin{height:44px;border-radius:14px;border:1px solid var(--line);background:#21140e;color:var(--gold2)}.iconbtn{width:46px;font-size:25px}.title{text-align:center}.title h1{margin:0;color:#ffe0a0;font-size:22px}.title p{margin:3px 0 0;color:#9e8b7a;font-size:11px}.coin{display:flex;align-items:center;gap:5px;padding:0 12px;font-weight:700;color:#ffd45b}
.turn{align-self:center;border:1px solid var(--line);background:#21140e;border-radius:999px;padding:8px 18px;color:#ffd77a;font-size:13px;box-shadow:0 0 20px #0004}.turn.ai{color:#ffad9f;border-color:#7b433c}.turn.end{color:#c9b9aa}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}.player{background:#21140e;border:1px solid #50351f;border-radius:16px;padding:9px;text-align:center}.player.active{border-color:#c58a35;box-shadow:0 0 20px #d9973618}.player .name{color:#a99584;font-size:11px}.player .score{font-size:21px;color:#ffe0a0;font-weight:700;margin-top:2px}.mini{font-size:10px;color:#7f6d5e;margin-top:2px}
.aihand{display:flex;justify-content:center;gap:5px;min-height:38px}.backtile{width:27px;height:38px;border:1px solid #95642a;border-radius:6px;background:repeating-linear-gradient(45deg,#8b5a20 0 3px,#5e3b18 3px 6px);box-shadow:0 2px 5px #0007}
.table{position:relative;height:285px;border:2px solid #694622;border-radius:26px;background:radial-gradient(circle at 50% 40%,#2a6040 0,#173d2a 48%,#0e261b 100%);box-shadow:inset 0 0 50px #0007,0 12px 30px #0006;overflow:hidden}.table:after{content:"";position:absolute;inset:8px;border:1px solid #e0ad4b22;border-radius:18px;pointer-events:none}.board{position:absolute;inset:0;display:flex;align-items:center;gap:7px;padding:24px 16px;overflow-x:auto;overflow-y:hidden;direction:ltr;z-index:2;scroll-behavior:smooth}.board::-webkit-scrollbar{height:5px}.board::-webkit-scrollbar-thumb{background:#b8792a;border-radius:10px}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c8b8a055;font-size:14px;z-index:1;padding:30px}.tile{width:48px;height:76px;flex:0 0 auto;border-radius:9px;border:2px solid #ad9365;background:linear-gradient(145deg,#fffdf5,#d8d0be);box-shadow:0 5px 12px #0007;display:flex;flex-direction:column;color:#1d1712;overflow:hidden;animation:in .22s ease}.tile-half{height:50%;display:grid;place-items:center;position:relative}.tile-half:first-child{border-bottom:1px solid #766e5e}.dots{width:29px;height:29px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.dot{width:6px;height:6px;border-radius:50%;background:#231c16;justify-self:center;align-self:center}@keyframes in{from{opacity:0;transform:translateY(-10px) scale(.85)}to{opacity:1;transform:none}}
.handtitle{text-align:center;color:#cdb79f;font-size:12px}.hand{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:82px}.hand .tile{cursor:pointer;transition:transform .16s,filter .16s}.hand .tile.playable{border-color:#f2bd52;box-shadow:0 0 0 2px #f2bd5222,0 6px 15px #0007}.hand .tile.playable:hover,.hand .tile.playable:active{transform:translateY(-8px) scale(1.03);filter:brightness(1.06)}.hand .tile.disabled{opacity:.48}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{min-height:46px;border-radius:13px;border:1px solid var(--line);background:#291910;color:#e8d3b8;font-weight:700}.btn.primary{background:linear-gradient(135deg,#b97821,#77460f);border-color:#d99a39;color:#fff7e8}.btn:disabled{opacity:.38}.btn:active{transform:scale(.98)}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.info .box{background:#1c110c;border:1px solid #432c1c;border-radius:12px;padding:8px;text-align:center}.label{font-size:9px;color:#806f60}.value{font-size:15px;color:#e9c77f;font-weight:700;margin-top:3px}
.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:20;backdrop-filter:blur(5px)}.overlay.show{display:grid}.modal{width:min(390px,100%);background:linear-gradient(145deg,#312015,#1a0f0b);border:1px solid #8b602c;border-radius:24px;padding:26px 19px;text-align:center;box-shadow:0 25px 70px #000b;animation:pop .22s ease}.resulticon{font-size:54px}.modal h2{margin:8px 0;color:#ffe0a0}.modal p{margin:0 0 13px;color:#bca897;line-height:1.8}.reward{color:#ffd35c;font-weight:700;margin-bottom:17px}.modal .btn{width:100%;margin-top:7px}@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,70px);opacity:0;transition:.25s;background:#2c1b12;border:1px solid #815829;color:#ffe0a0;border-radius:13px;padding:10px 15px;z-index:30;font-size:12px;box-shadow:0 8px 25px #0008;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:600px){.app{padding:10px 9px calc(14px + env(safe-area-inset-bottom))}.table{height:250px}.board{padding:20px 12px}.tile{width:43px;height:69px}.dots{width:25px;height:25px}.dot{width:5px;height:5px}.hand{gap:5px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1}.coin{padding:0 9px}.title h1{font-size:20px}.aihand{min-height:34px}.backtile{width:24px;height:34px}}
@media(max-width:380px){.tile{width:39px;height:63px}.dots{width:22px;height:22px}.dot{width:4px;height:4px}.table{height:230px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn" onclick="goHome()" aria-label="گەڕانەوە">‹</button>
    <div class="title"><h1>🀄 دۆمینۆ</h1><p>یاری کوردی</p></div>
    <div class="coin">🪙 <span id="coins">0</span></div>
  </header>

  <div id="turn" class="turn">نۆرەی تۆیە 🎯</div>

  <div class="players">
    <div id="pCard" class="player active"><div class="name">👤 تۆ</div><div id="pScore" class="score">0</div><div class="mini">خاڵی پارچەکان</div></div>
    <div id="aCard" class="player"><div class="name">🤖 AI</div><div id="aScore" class="score">0</div><div class="mini">خاڵی پارچەکان</div></div>
  </div>

  <div id="aiHand" class="aihand" aria-label="پارچەکانی AI"></div>

  <section class="table">
    <div id="empty" class="empty">یەکەم پارچە دابنێ<br>دواتر یاری دەستی پێدەکات 🀄</div>
    <div id="board" class="board"></div>
  </section>

  <div class="handtitle">پارچەکانی تۆ — <span id="count">7</span></div>
  <div id="hand" class="hand"></div>

  <div class="controls">
    <button id="draw" class="btn primary" onclick="drawPlayer()">🎴 کێشان</button>
    <button class="btn" onclick="newGame()">🔄 یاریی نوێ</button>
    <button class="btn" onclick="goHome()">🏠 سەرەکی</button>
  </div>

  <div class="info">
    <div class="box"><div class="label">پارچەی ماوە</div><div id="stock" class="value">14</div></div>
    <div class="box"><div class="label">بردن</div><div id="wins" class="value">0</div></div>
    <div class="box"><div class="label">باختن</div><div id="losses" class="value">0</div></div>
  </div>
</div>

<div id="overlay" class="overlay"><div class="modal"><div id="icon" class="resulticon">🏆</div><h2 id="resultTitle">پیرۆزە!</h2><p id="resultText"></p><div id="reward" class="reward"></div><button class="btn primary" onclick="newGame()">🔄 یارییەکی تر</button><button class="btn" onclick="goHome()">🏠 سەرەکی</button></div></div>
<div id="toast" class="toast"></div>

<script>
let player=[],ai=[],stock=[],board=[],turn='player',ended=false,toastTimer;
let coins=+localStorage.getItem('yk_coins')||0;
let wins=+localStorage.getItem('yk_domino_wins')||0;
let losses=+localStorage.getItem('yk_domino_losses')||0;

const $=id=>document.getElementById(id);
function makeTiles(){let x=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)x.push({a,b,id:`${a}-${b}`});return x}
function shuffle(x){for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function newGame(){ $('overlay').classList.remove('show'); ended=false;turn='player';board=[];let x=shuffle(makeTiles());player=x.splice(0,7);ai=x.splice(0,7);stock=x;render();toast('یارییەکی نوێ دەستی پێکرد 🎮') }
function playable(t){if(!board.length)return true;let l=board[0].a,r=board[board.length-1].b;return t.a===l||t.b===l||t.a===r||t.b===r}
function playableList(hand){return hand.filter(playable)}
function place(t){if(!board.length){board.push({a:t.a,b:t.b});return true}let l=board[0].a,r=board.at(-1).b;if(t.a===r)board.push({a:t.a,b:t.b});else if(t.b===r)board.push({a:t.b,b:t.a});else if(t.b===l)board.unshift({a:t.a,b:t.b});else if(t.a===l)board.unshift({a:t.b,b:t.a});else return false;return true}
function playPlayer(i){if(ended||turn!=='player')return;let t=player[i];if(!playable(t)){toast('ئەم پارچەیە ناتوانرێت دابنرێت ❌');return}place(t);player.splice(i,1);render();if(!player.length){finish('player');return}turn='ai';render();setTimeout(aiTurn,650)}
function drawPlayer(){if(ended||turn!=='player')return;let p=playableList(player);if(board.length&&p.length){toast('پارچەی یاری‌کراوت هەیە 🀄');return}if(!stock.length){aiTurn();return}let t=stock.shift();player.push(t);render();if(playable(t))toast('ئەم پارچەیە دەتوانیت یاری پێ بکەیت ✅');else if(!stock.length&&!playableList(player).length){toast('پارچەی گونجاو نییە؛ نۆرە دەگۆڕێت');setTimeout(passPlayer,450)}else toast('پارچەیەکت کێشا 🎴')}
function passPlayer(){if(ended)return;if(playableList(player).length||stock.length){return}turn='ai';render();setTimeout(aiTurn,500)}
function aiTurn(){if(ended)return;turn='ai';render();let p=playableList(ai);while(!p.length&&stock.length){ai.push(stock.shift());p=playableList(ai)}if(!p.length){turn='player';render();if(!stock.length)checkBlocked();return}p.sort((a,b)=>(b.a+b.b)-(a.a+a.b));let t=p[0],i=ai.findIndex(x=>x.id===t.id);place(ai[i]);ai.splice(i,1);render();if(!ai.length){finish('ai');return}turn='player';render()}
function checkBlocked(){if(stock.length)return;let ps=pips(player),as=pips(ai);if(ps<as)finish('player',true);else if(as<ps)finish('ai',true);else finish('draw',true)}
function pips(h){return h.reduce((s,t)=>s+t.a+t.b,0)}
function finish(w,blocked=false){if(ended)return;ended=true;let reward=0;if(w==='player'){wins++;reward=blocked?30:50;coins+=reward;localStorage.setItem('yk_domino_wins',wins);localStorage.setItem('yk_coins',coins);$('icon').textContent='🏆';$('resultTitle').textContent='پیرۆزە! تۆ بردتەوە 🎉';$('resultText').textContent=blocked?'بە خاڵی کەمتر بردتەوە.':'هەموو پارچەکانت تەواو کرد.';$('reward').textContent=`🪙 +${reward} Coin`}else if(w==='ai'){losses++;localStorage.setItem('yk_domino_losses',losses);$('icon').textContent='🤖';$('resultTitle').textContent='AI بردی';$('resultText').textContent=blocked?'AI خاڵی کەمتر بوو.':'AI هەموو پارچەکانی تەواو کرد.';$('reward').textContent='🪙 +0 Coin'}else{coins+=10;localStorage.setItem('yk_coins',coins);$('icon').textContent='🤝';$('resultTitle').textContent='یەکسان بوو';$('resultText').textContent='خاڵەکان یەکسان بوون.';$('reward').textContent='🪙 +10 Coin';localStorage.setItem('yk_coins',coins)}updateStorage();setTimeout(()=>$('overlay').classList.add('show'),300)}
function half(n){let d=document.createElement('div');d.className='tile-half';let g=document.createElement('div');g.className='dots';let pos={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];for(let i=0;i<9;i++){let q=document.createElement('i');if(pos.includes(i))q.className='dot';g.appendChild(q)}d.appendChild(g);return d}
function tileEl(t){let e=document.createElement('div');e.className='tile';e.append(half(t.a),half(t.b));return e}
function render(){renderBoard();renderHand();renderAI();update();}
function renderBoard(){let b=$('board');b.innerHTML='';$('empty').style.display=board.length?'none':'grid';board.forEach(t=>b.appendChild(tileEl(t)));requestAnimationFrame(()=>b.scrollLeft=b.scrollWidth)}
function renderHand(){let h=$('hand');h.innerHTML='';player.forEach((t,i)=>{let e=tileEl(t);if(turn==='player'&&playable(t))e.classList.add('playable');else if(turn==='player')e.classList.add('disabled');e.onclick=()=>playPlayer(i);h.appendChild(e)});$('count').textContent=player.length}
function renderAI(){let h=$('aiHand');h.innerHTML='';for(let i=0;i<ai.length;i++){let e=document.createElement('div');e.className='backtile';h.appendChild(e)}}
function update(){ $('turn').textContent=ended?'یاری کۆتایی هات 🏁':turn==='player'?'نۆرەی تۆیە 🎯':'نۆرەی AI ـە 🤖';$('turn').className='turn '+(ended?'end':turn==='ai'?'ai':'');$('pCard').classList.toggle('active',turn==='player'&&!ended);$('aCard').classList.toggle('active',turn==='ai'&&!ended);$('pScore').textContent=pips(player);$('aScore').textContent=pips(ai);$('stock').textContent=stock.length;$('draw').disabled=!(turn==='player'&&!ended&&(!board.length||!playableList(player).length)&&stock.length);updateStorage()}
function updateStorage(){$('coins').textContent=coins;$('wins').textContent=wins;$('losses').textContent=losses}
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
function goHome(){location.href='../'}
window.addEventListener('load',()=>{updateStorage();newGame()});
</script>
</body>
</html>
