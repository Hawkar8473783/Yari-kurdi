<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#17100d">
  <title>دۆمینۆ | یاری کوردی</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #3b2417 0%, #1b110d 42%, #0d0907 100%);
      color: #fff;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #6f4c28;
      border-radius: 14px;
      background: #241711;
      color: #ffd77a;
      font-size: 23px;
    }

    .title-box {
      flex: 1;
      text-align: center;
    }

    .title-box h1 {
      margin: 0;
      font-size: 21px;
      color: #ffe0a0;
    }

    .title-box p {
      margin: 3px 0 0;
      color: #aa9482;
      font-size: 12px;
    }

    .coins {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #241711;
      border: 1px solid #624321;
      padding: 9px 12px;
      border-radius: 14px;
      color: #ffd35c;
      font-weight: bold;
      white-space: nowrap;
    }

    /* STATUS */
    .status {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .turn {
      padding: 9px 18px;
      border-radius: 30px;
      background: #241711;
      border: 1px solid #694826;
      color: #d9c4ae;
      font-size: 14px;
    }

    .turn.player {
      color: #ffd66d;
      border-color: #b47a28;
      box-shadow: 0 0 20px rgba(255, 188, 65, .12);
    }

    .turn.ai {
      color: #ff9c8d;
      border-color: #88483f;
    }

    /* SCORE */
    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .score-card {
      background: rgba(34, 22, 16, .9);
      border: 1px solid #50351f;
      border-radius: 16px;
      padding: 11px;
      text-align: center;
    }

    .score-card.active {
      border-color: #b57a2d;
      box-shadow: 0 0 20px rgba(222, 157, 54, .12);
    }

    .score-name {
      color: #a99584;
      font-size: 12px;
    }

    .score-value {
      margin-top: 4px;
      font-size: 23px;
      color: #ffe0a0;
      font-weight: bold;
    }

    /* TABLE */
    .table {
      position: relative;
      min-height: 270px;
      border-radius: 25px;
      border: 2px solid #674526;
      background:
        radial-gradient(circle at center, #274c35 0%, #173526 55%, #10251b 100%);
      box-shadow:
        inset 0 0 50px rgba(0,0,0,.35),
        0 12px 35px rgba(0,0,0,.3);
      padding: 25px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .table::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(215, 173, 91, .18);
      border-radius: 18px;
      pointer-events: none;
    }

    .empty-message {
      color: rgba(255,255,255,.35);
      font-size: 14px;
      z-index: 1;
    }

    .board {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px;
      position: relative;
      z-index: 2;
    }

    /* DOMINO TILE */
    .tile {
      width: 52px;
      height: 82px;
      background: linear-gradient(145deg, #fffdf4, #d9d0bb);
      border: 2px solid #a99470;
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      color: #18130f;
      box-shadow:
        0 5px 10px rgba(0,0,0,.35),
        inset 0 0 3px rgba(255,255,255,.8);
      overflow: hidden;
      flex-shrink: 0;
    }

    .tile-half {
      height: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .tile-half:first-child {
      border-bottom: 1px solid #77705f;
    }

    .dot-grid {
      width: 30px;
      height: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #241c16;
      align-self: center;
      justify-self: center;
    }

    /* HAND */
    .hand-section {
      margin-top: 13px;
    }

    .section-title {
      color: #cdb69d;
      font-size: 13px;
      margin-bottom: 8px;
      text-align: center;
    }

    .hand {
      min-height: 95px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      padding: 5px;
    }

    .hand .tile {
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .hand .tile:hover {
      transform: translateY(-7px);
      filter: brightness(1.08);
    }

    .hand .tile.playable {
      border-color: #f4bb4f;
      box-shadow:
        0 0 0 2px rgba(244,187,79,.14),
        0 7px 15px rgba(0,0,0,.35);
    }

    .hand .tile.disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      min-height: 45px;
      border: 1px solid #725027;
      border-radius: 13px;
      padding: 0 18px;
      background: #2a1b12;
      color: #e8d2b3;
      font-size: 14px;
      font-weight: bold;
    }

    .btn.primary {
      background: linear-gradient(135deg, #b97922, #7e4b15);
      border-color: #d89a3b;
      color: #fff7e6;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn:active {
      transform: scale(.97);
    }

    /* INFO */
    .info {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .info-box {
      background: rgba(30,19,14,.85);
      border: 1px solid #49311e;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }

    .info-label {
      color: #887666;
      font-size: 10px;
    }

    .info-value {
      margin-top: 3px;
      color: #e9c77f;
      font-weight: bold;
      font-size: 15px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(145deg, #302016, #1b110d);
      border: 1px solid #8b602c;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      animation: pop .25s ease;
    }

    @keyframes pop {
      from {
        transform: scale(.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .result-icon {
      font-size: 55px;
    }

    .modal h2 {
      margin: 10px 0 5px;
      color: #ffe0a0;
    }

    .modal p {
      color: #bba795;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .reward {
      color: #ffd35c;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(80px);
      background: #2c1c13;
      border: 1px solid #805829;
      color: #ffe0a0;
      border-radius: 14px;
      padding: 11px 18px;
      z-index: 200;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 25px rgba(0,0,0,.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .app {
        padding: 10px;
      }

      .table {
        min-height: 240px;
        padding: 20px 8px;
      }

      .tile {
        width: 44px;
        height: 70px;
      }

      .dot-grid {
        width: 25px;
        height: 25px;
      }

      .dot {
        width: 5px;
        height: 5px;
      }

      .board {
        gap: 5px;
      }

      .hand {
        gap: 5px;
      }

      .controls .btn {
        flex: 1;
        min-width: 120px;
        padding: 0 10px;
      }
    }

    @media (max-width: 380px) {
      .tile {
        width: 39px;
        height: 63px;
      }

      .dot-grid {
        width: 22px;
        height: 22px;
      }

      .dot {
        width: 4px;
        height: 4px;
      }

      .coins {
        padding: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <header class="topbar">
    <button class="back-btn" onclick="goHome()">‹</button>

    <div class="title-box">
      <h1>🀄 دۆمینۆ</h1>
      <p>یاری کوردی</p>
    </div>

    <div class="coins">
      🪙 <span id="coins">0</span>
    </div>
  </header>

  <!-- TURN -->
  <div class="status">
    <div id="turnText" class="turn player">
      نۆرەی تۆیە 🎯
    </div>
  </div>

  <!-- SCORE -->
  <div class="score-row">
    <div id="playerScoreCard" class="score-card active">
      <div class="score-name">👤 تۆ</div>
      <div id="playerScore" class="score-value">0</div>
    </div>

    <div id="aiScoreCard" class="score-card">
      <div class="score-name">🤖 AI</div>
      <div id="aiScore" class="score-value">0</div>
    </div>
  </div>

  <!-- TABLE -->
  <section class="table">
    <div id="emptyMessage" class="empty-message">
      یارییەکە دەست پێ بکە 🀄
    </div>

    <div id="board" class="board"></div>
  </section>

  <!-- HAND -->
  <section class="hand-section">
    <div class="section-title">
      پارچەکانی تۆ — <span id="handCount">7</span>
    </div>

    <div id="playerHand" class="hand"></div>
  </section>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="drawBtn" class="btn primary" onclick="drawForPlayer()">
      🎴 کێشان
    </button>

    <button class="btn" onclick="newGame()">
      🔄 یاریی نوێ
    </button>

    <button class="btn" onclick="goHome()">
      🏠 سەرەکی
    </button>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="info-box">
      <div class="info-label">پارچەی ماوە</div>
      <div id="boneyardCount" class="info-value">14</div>
    </div>

    <div class="info-box">
      <div class="info-label">بردن</div>
      <div id="wins" class="info-value">0</div>
    </div>

    <div class="info-box">
      <div class="info-label">باختن</div>
      <div id="losses" class="info-value">0</div>
    </div>
  </div>

</div>

<!-- RESULT MODAL -->
<div id="resultModal" class="modal">
  <div class="modal-box">

    <div id="resultIcon" class="result-icon">🏆</div>

    <h2 id="resultTitle">پیرۆزە!</h2>

    <p id="resultText">
      تۆ یارییەکەت بردەوە.
    </p>

    <div id="rewardText" class="reward">
      🪙 +50 Coin
    </div>

    <button class="btn primary" onclick="newGame()">
      🔄 یارییەکی تر
    </button>

    <button class="btn" style="margin-top:8px" onclick="goHome()">
      🏠 سەرەکی
    </button>

  </div>
</div>

<div id="toast" class="toast"></div>


<script>
/* =========================================================
   YARI-KURDI DOMINO
   2 Players: Human vs AI
   28 Domino Tiles
   ========================================================= */

let allTiles = [];
let playerHand = [];
let aiHand = [];
let boneyard = [];
let board = [];

let currentTurn = "player";
let gameOver = false;
let playerScore = 0;
let aiScore = 0;
let consecutivePasses = 0;

let coins = Number(localStorage.getItem("yk_coins") || 0);
let wins = Number(localStorage.getItem("yk_domino_wins") || 0);
let losses = Number(localStorage.getItem("yk_domino_losses") || 0);


/* =========================================================
   START
   ========================================================= */

window.addEventListener("load", () => {
  updateStorageUI();
  newGame();
});


/* =========================================================
   CREATE 28 DOMINO TILES
   ========================================================= */

function createTiles() {
  const tiles = [];

  for (let a = 0; a <= 6; a++) {
    for (let b = a; b <= 6; b++) {
      tiles.push({
        a: a,
        b: b,
        id: `${a}-${b}`
      });
    }
  }

  return tiles;
}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}


/* =========================================================
   NEW GAME
   ========================================================= */

function newGame() {

  closeModal();

  allTiles = shuffle(createTiles());

  playerHand = allTiles.splice(0, 7);
  aiHand = allTiles.splice(0, 7);

  boneyard = allTiles;

  board = [];

  playerScore = 0;
  aiScore = 0;

  consecutivePasses = 0;

  gameOver = false;

  /*
    Player starts.
  */
  currentTurn = "player";

  render();

  showToast("یارییەکە دەستی پێ کرد 🎮");
}


/* =========================================================
   TILE PLAYABILITY
   ========================================================= */

function canPlay(tile) {

  if (board.length === 0) {
    return true;
  }

  const left = board[0].a;
  const right = board[board.length - 1].b;

  return (
    tile.a === left ||
    tile.b === left ||
    tile.a === right ||
    tile.b === right
  );
}


/* =========================================================
   FIND PLAYABLE TILES
   ========================================================= */

function getPlayable(hand) {
  return hand.filter(tile => canPlay(tile));
}


/* =========================================================
   PLACE TILE ON BOARD
   ========================================================= */

function placeTile(tile) {

  if (board.length === 0) {

    board.push({
      a: tile.a,
      b: tile.b
    });

    return true;
  }

  const left = board[0].a;
  const right = board[board.length - 1].b;

  /*
    Prefer right side.
  */
  if (tile.a === right) {

    board.push({
      a: tile.a,
      b: tile.b
    });

    return true;
  }

  if (tile.b === right) {

    board.push({
      a: tile.b,
      b: tile.a
    });

    return true;
  }

  /*
    Try left side.
  */
  if (tile.b === left) {

    board.unshift({
      a: tile.a,
      b: tile.b
    });

    return true;
  }

  if (tile.a === left) {

    board.unshift({
      a: tile.b,
      b: tile.a
    });

    return true;
  }

  return false;
}


/* =========================================================
   PLAYER PLAYS TILE
   ========================================================= */

function playerPlay(index) {

  if (gameOver) return;

  if (currentTurn !== "player") {
    showToast("ئێستا نۆرەی تۆ نییە!");
    return;
  }

  const tile = playerHand[index];

  if (!tile) return;

  if (!canPlay(tile)) {

    showToast("ئەم پارچەیە ناتوانرێت دابنرێت ❌");

    return;
  }

  placeTile(tile);

  playerHand.splice(index, 1);

  consecutivePasses = 0;

  render();

  /*
    Player wins immediately if hand is empty.
  */
  if (playerHand.length === 0) {

    finishGame("player");

    return;
  }

  currentTurn = "ai";

  render();

  setTimeout(aiTurn, 800);
}


/* =========================================================
   PLAYER DRAW
   ========================================================= */

function drawForPlayer() {

  if (gameOver) return;

  if (currentTurn !== "player") {
    showToast("چاوەڕێی نۆرەکەت بکە ⏳");
    return;
  }

  const playable = getPlayable(playerHand);

  /*
    If player already has playable tile,
    drawing is not allowed.
  */
  if (playable.length > 0 && board.length > 0) {

    showToast("پارچەی یاری‌کراوت هەیە! 🀄");

    return;
  }

  if (boneyard.length === 0) {

    passPlayer();

    return;
  }

  const tile = boneyard.shift();

  playerHand.push(tile);

  showToast("پارچەیەکت کێشا 🎴");

  render();

  /*
    If drawn tile is playable,
    player can choose it.
  */

  if (canPlay(tile)) {
    showToast("ئەم پارچەیە دەتوانیت یاری پێ بکەیت ✅");
  } else {

    /*
      If nothing is playable and no tiles remain,
      pass.
    */
    if (
      boneyard.length === 0 &&
      getPlayable(playerHand).length === 0
    ) {
      setTimeout(passPlayer, 400);
    }
  }
}


/* =========================================================
   PLAYER PASS
   ========================================================= */

function passPlayer() {

  if (gameOver) return;

  if (getPlayable(playerHand).length > 0) {

    showToast("پارچەی یاری‌کراوت هەیە!");

    return;
  }

  if (boneyard.length > 0) {

    showToast("هێشتا پارچەی ماوە، کێشی 🎴");

    return;
  }

  consecutivePasses++;

  currentTurn = "ai";

  render();

  setTimeout(aiTurn, 700);
}


/* =========================================================
   AI TURN
   ========================================================= */

function aiTurn() {

  if (gameOver) return;

  currentTurn = "ai";

  render();

  let playable = getPlayable(aiHand);

  /*
    AI draws until it finds playable tile
    or boneyard becomes empty.
  */

  while (playable.length === 0 && boneyard.length > 0) {

    const tile = boneyard.shift();

    aiHand.push(tile);

    playable = getPlayable(aiHand);
  }

  /*
    No playable tile.
  */
  if (playable.length === 0) {

    consecutivePasses++;

    if (boneyard.length === 0) {

      checkBlockedGame();

      return;
    }

    currentTurn = "player";

    render();

    return;
  }

  /*
    Choose a tile.
    AI prefers higher pip total.
  */
  playable.sort((x, y) => {

    const xValue = x.a + x.b;
    const yValue = y.a + y.b;

    return yValue - xValue;
  });

  const chosen = playable[0];

  const index = aiHand.findIndex(
    tile => tile.id === chosen.id
  );

  if (index !== -1) {

    placeTile(aiHand[index]);

    aiHand.splice(index, 1);

    consecutivePasses = 0;

    render();

    /*
      AI wins.
    */
    if (aiHand.length === 0) {

      finishGame("ai");

      return;
    }
  }

  currentTurn = "player";

  render();
}


/* =========================================================
   BLOCKED GAME
   ========================================================= */

function checkBlockedGame() {

  if (boneyard.length > 0) return;

  const playerPips = countPips(playerHand);
  const aiPips = countPips(aiHand);

  /*
    Lower remaining pips wins.
  */

  if (playerPips < aiPips) {

    finishGame("player", true);

  } else if (aiPips < playerPips) {

    finishGame("ai", true);

  } else {

    finishGame("draw", true);
  }
}


/* =========================================================
   COUNT PIPS
   ========================================================= */

function countPips(hand) {

  return hand.reduce(
    (sum, tile) => sum + tile.a + tile.b,
    0
  );
}


/* =========================================================
   FINISH GAME
   ========================================================= */

function finishGame(winner, blocked = false) {

  if (gameOver) return;

  gameOver = true;

  let reward = 0;

  if (winner === "player") {

    wins++;

    reward = blocked ? 30 : 50;

    coins += reward;

    localStorage.setItem(
      "yk_domino_wins",
      wins
    );

    localStorage.setItem(
      "yk_coins",
      coins
    );

    document.getElementById("resultIcon").textContent = "🏆";

    document.getElementById("resultTitle").textContent =
      "پیرۆزە! تۆ بردتەوە 🎉";

    document.getElementById("resultText").textContent =
      blocked
        ? "تۆ بە خاڵی کەمتر یارییەکەت بردەوە."
        : "هەموو پارچەکانی تۆ تەواو بوون.";

    document.getElementById("rewardText").textContent =
      `🪙 +${reward} Coin`;

  } else if (winner === "ai") {

    losses++;

    localStorage.setItem(
      "yk_domino_losses",
      losses
    );

    document.getElementById("resultIcon").textContent = "😅";

    document.getElementById("resultTitle").textContent =
      "ئەمجارە AI بردی";

    document.getElementById("resultText").textContent =
      blocked
        ? "AI خاڵی کەمتر بوو."
        : "AI هەموو پارچەکانی تەواو کرد.";

    document.getElementById("rewardText").textContent =
      "🪙 +0 Coin";

  } else {

    document.getElementById("resultIcon").textContent = "🤝";

    document.getElementById("resultTitle").textContent =
      "یەکسان بوو";

    document.getElementById("resultText").textContent =
      "هەردووکتان هەمان خاڵتان هەبوو.";

    document.getElementById("rewardText").textContent =
      "🪙 +10 Coin";

    coins += 10;

    localStorage.setItem(
      "yk_coins",
      coins
    );
  }

  updateStorageUI();

  setTimeout(() => {

    document
      .getElementById("resultModal")
      .classList.add("show");

  }, 400);
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  renderBoard();

  renderPlayerHand();

  updateStatus();

  updateInfo();
}


/* =========================================================
   RENDER BOARD
   ========================================================= */

function renderBoard() {

  const boardElement =
    document.getElementById("board");

  const emptyMessage =
    document.getElementById("emptyMessage");

  boardElement.innerHTML = "";

  if (board.length === 0) {

    emptyMessage.style.display = "block";

    return;

  } else {

    emptyMessage.style.display = "none";
  }

  board.forEach(tile => {

    boardElement.appendChild(
      createTileElement(tile)
    );

  });
}


/* =========================================================
   RENDER PLAYER HAND
   ========================================================= */

function renderPlayerHand() {

  const handElement =
    document.getElementById("playerHand");

  handElement.innerHTML = "";

  playerHand.forEach((tile, index) => {

    const element =
      createTileElement(tile);

    const playable =
      currentTurn === "player" &&
      canPlay(tile);

    if (playable) {

      element.classList.add("playable");

    } else if (currentTurn === "player") {

      element.classList.add("disabled");

    }

    element.onclick = () => {

      playerPlay(index);

    };

    handElement.appendChild(element);

  });

  document.getElementById("handCount").textContent =
    playerHand.length;
}


/* =========================================================
   CREATE TILE ELEMENT
   ========================================================= */

function createTileElement(tile) {

  const element =
    document.createElement("div");

  element.className = "tile";

  element.appendChild(
    createHalf(tile.a)
  );

  element.appendChild(
    createHalf(tile.b)
  );

  return element;
}


/* =========================================================
   CREATE DOT HALF
   ========================================================= */

function createHalf(number) {

  const half =
    document.createElement("div");

  half.className = "tile-half";

  const grid =
    document.createElement("div");

  grid.className = "dot-grid";

  const positions = {

    0: [],

    1: [4],

    2: [0, 8],

    3: [0, 4, 8],

    4: [0, 2, 6, 8],

    5: [0, 2, 4, 6, 8],

    6: [0, 2, 3, 5, 6, 8]
  };

  for (let i = 0; i < 9; i++) {

    const dot =
      document.createElement("div");

    if (positions[number].includes(i)) {
      dot.className = "dot";
    }

    grid.appendChild(dot);
  }

  half.appendChild(grid);

  return half;
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus() {

  const turn =
    document.getElementById("turnText");

  const playerCard =
    document.getElementById("playerScoreCard");

  const aiCard =
    document.getElementById("aiScoreCard");

  turn.classList.remove("player", "ai");

  if (gameOver) {

    turn.textContent = "یاری کۆتایی هات 🏁";

  } else if (currentTurn === "player") {

    turn.textContent = "نۆرەی تۆیە 🎯";

    turn.classList.add("player");

    playerCard.classList.add("active");
    aiCard.classList.remove("active");

  } else {

    turn.textContent = "نۆرەی AI ـە 🤖";

    turn.classList.add("ai");

    aiCard.classList.add("active");
    playerCard.classList.remove("active");
  }

  document.getElementById("playerScore").textContent =
    countPips(playerHand);

  document.getElementById("aiScore").textContent =
    countPips(aiHand);
}


/* =========================================================
   INFO
   ========================================================= */

function updateInfo() {

  document.getElementById("boneyardCount").textContent =
    boneyard.length;

  document.getElementById("wins").textContent =
    wins;

  document.getElementById("losses").textContent =
    losses;

  const drawButton =
    document.getElementById("drawBtn");

  if (
    currentTurn === "player" &&
    !gameOver &&
    getPlayable(playerHand).length === 0 &&
    boneyard.length > 0
  ) {

    drawButton.disabled = false;

  } else {

    drawButton.disabled = true;
  }
}


/* =========================================================
   STORAGE UI
   ========================================================= */

function updateStorageUI() {

  document.getElementById("coins").textContent =
    coins;

  document.getElementById("wins").textContent =
    wins;

  document.getElementById("losses").textContent =
    losses;
}


/* =========================================================
   MODAL
   ========================================================= */

function closeModal() {

  document
    .getElementById("resultModal")
    .classList.remove("show");
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    toast.classList.remove("show");

  }, 1800);
}


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

  window.location.href = "../";
}

</script>
